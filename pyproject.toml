[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-ai"
version = "0.1.0"
description = "Roadmap de aprendizaje en Embodied AI / AIoT"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["fase-0"]

[tool.mypy]
python_version = "3.12"
strict = true
