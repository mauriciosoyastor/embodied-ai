[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-ai"
version = "0.1.0"
description = "Roadmap de aprendizaje en Embodied AI / AIoT"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]
fase1 = ["google-genai>=1.0.0", "python-dotenv>=1.0.0", "pydantic>=2.0.0", "pydantic-ai>=0.0.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["plataforma*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["fase-0", "fase-1"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_unused_ignores = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["numpy.*", "cv2.*", "fastapi.*", "onnxruntime.*", "mediapipe.*", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plataforma.webcam.backend.ws"]
ignore_missing_imports = true

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.uv.workspace]
members = ["plataforma/webcam/backend"]
