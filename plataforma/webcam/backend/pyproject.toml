[project]
name = "webcam-backend"
version = "0.1.0"
description = "Backend webcam plataforma - YOLO11n ONNX + MediaPipe Hand Landmarker"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets==16.1.1",
    "onnxruntime==1.29.*",
    "opencv-python==4.14.*",
    "mediapipe==1.0.1",
    "numpy",
    "pydantic>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]
