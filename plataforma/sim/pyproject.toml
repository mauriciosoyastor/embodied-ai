[project]
name = "sim"
version = "0.1.0"
description = "Bridge/Adapter sim — FakeAdapter headless para orquestador"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-ai>=0.0.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]
