name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy plataforma/webcam
      - name: Tests
        run: uv run pytest
      - name: CONTEXT linter (ADR-0007)
        run: uv run python harness/check_context.py
      - name: Pre-commit guard (no --no-verify)
        run: uv run pre-commit run --all-files

  changes:
    runs-on: ubuntu-latest
    # Needed for dorny/paths-filter to compare against base
    permissions:
      pull-requests: read
    outputs:
      webcam: ${{ steps.filter.outputs.webcam }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            webcam:
              - 'plataforma/webcam/**'

  webcam-ci:
    needs: changes
    if: ${{ needs.changes.outputs.webcam == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Ruff check (webcam)
        run: uv run ruff check plataforma/webcam
      - name: Ruff format check (webcam)
        run: uv run ruff format --check plataforma/webcam
      - name: Mypy (webcam)
        run: uv run mypy plataforma/webcam
      - name: Pytest (webcam) headless
        run: uv run pytest plataforma/webcam -q
