repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude: '^Guía Maestra de Aprendizaje en Inteligencia Artificial Corpórea \(Embodied AI\) e AIoT\.md$'
      - id: end-of-file-fixer
        exclude: '^Guía Maestra de Aprendizaje en Inteligencia Artificial Corpórea \(Embodied AI\) e AIoT\.md$'
  - repo: local
    hooks:
      - id: mypy-plataforma
        name: mypy plataforma/webcam
        entry: uv run mypy plataforma/webcam
        language: system
        files: ^plataforma/
        pass_filenames: false
      - id: pytest-plataforma
        name: pytest plataforma/webcam
        entry: uv run pytest plataforma/webcam -q
        language: system
        files: ^plataforma/
        pass_filenames: false
      - id: citas-existen
        name: citas a docs/tests/harness existen
        entry: python .github/scripts/check-citas-existen.py
        language: system
        files: '^(\.opencode/commands/.*\.md|docs/guides/golden-portable\.md)$'
        pass_filenames: false
