# Compose dev: backend :8000 + frontend :5173 + ollama :11434.
# Uso: docker compose up -d --build && docker exec embodied-ai-ollama-1 ollama pull qwen2.5:1.5b
# Keys (.env) y modelos (*.onnx) nunca se bakean: van por env_file y volumen.
services:
  ollama:
    image: ollama/ollama:latest
    # Sin ports: el :11434 del host lo usa otro proyecto (modoops-ollama-1).
    # El backend llega por red interna (OLLAMA_BASE_URL=http://ollama:11434/v1).
    # Para exponerlo: agregar "11434:11434" a ports (bajar modoops antes).
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: plataforma/webcam/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: fase-1/.env
        required: false
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen2.5:1.5b
      OMP_NUM_THREADS: "2"
    volumes:
      - .:/app
      - webcam-models:/app/plataforma/webcam/backend/models
    depends_on:
      - ollama
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: plataforma/webcam/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./plataforma/webcam/frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ollama-data:
  webcam-models:
  frontend-node-modules:
